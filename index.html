:root{--g:#58cc02;--gd:#58a700;--b:#1cb0f6;--bd:#1899d6;--o:#ff9600;--r:#ff4b4b;--y:#ffc800;--ink:#3c3c3c;--mut:#777;--line:#e5e5e5;--bg:#fff;
 --sheetH:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(16px,calc(1.15vmin + 11px),27px)}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#bfe6ff;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overscroll-behavior-y:none}
h1,h2,h3,.fr{font-family:Bodka,Nunito,sans-serif;margin:0;font-weight:600}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;touch-action:manipulation}
.wrap{position:relative;z-index:1;padding:0 0 calc(30px + var(--sheetH))}
#bg{position:fixed;inset:0;z-index:0;animation:fade .6s}#bg svg{width:100%;height:100%;display:block}
.col{max-width:46rem;margin:0 auto;padding:0 1rem}
.screen{display:none}.screen.on{display:block;animation:fade .3s;min-height:100dvh}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 3D tlačidlá */
.b3{border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:#fff;font-weight:800;transition:transform .05s}
.b3:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.bp{background:var(--g);border-color:var(--gd);color:#fff;text-transform:uppercase;letter-spacing:.04em;font-family:Nunito,system-ui,sans-serif;font-weight:900}
.bb{background:var(--b);border-color:var(--bd);color:#fff;text-transform:uppercase;letter-spacing:.04em;font-weight:900}
.wide{width:100%;padding:15px;font-size:1.05rem}
/* horná lišta domov */
.hbar{position:sticky;top:0;z-index:20;background:#ffffffd9;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid #ffffff;box-shadow:0 2px 12px #0001}.hbar .col{display:flex;align-items:center;gap:8px;padding-top:.6rem;padding-bottom:.6rem}
.logo{display:flex;align-items:center;gap:.5rem;font-family:Bodka,Nunito,sans-serif;font-weight:700;font-size:1.15rem;line-height:1.05;color:#ff4b4b;flex:none}.logo .bodka{width:2.4rem;height:2.4rem}.logo small{display:block;color:var(--ink);font-size:.7rem;font-family:Nunito;font-weight:900}
@media (max-width:560px){.logo span{display:none}.seg .rw{display:none}.seg button{font-size:1.05rem}}
.seg{display:flex;flex:1;background:#f1f1f1;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 2px;border-radius:10px;font-weight:900;font-size:.9rem;color:var(--mut);line-height:1.1}
.seg button small{display:block;font-size:.68rem;font-weight:800}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.chip{display:flex;align-items:center;gap:4px;font-weight:900;color:var(--y);font-size:1.05rem;padding:0 4px;text-shadow:0 1px 0 #d9a700}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;flex:none}
.greet{display:flex;align-items:center;gap:10px;margin:1rem 0 .3rem;background:#ffffffd9;border-radius:1.5rem;padding:.6rem;backdrop-filter:blur(6px);box-shadow:0 6px 20px #0001}
.greet .bodka{width:5rem;height:5rem}
.bub{position:relative;flex:1;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px;font-weight:800;line-height:1.35}
.bub::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.spk{width:40px;height:40px;border-radius:12px;font-size:1.1rem;flex:none;display:grid;place-items:center}
/* jednotka a cesta */
.ubox{margin-top:1.4rem;background:#ffffffc7;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:1.8rem;padding:.6rem .6rem 1rem;box-shadow:0 8px 24px #00000014;position:relative;overflow:hidden}
.ubox .usc{position:absolute;inset:0;opacity:.35;pointer-events:none}.ubox .usc svg{width:100%;height:100%}
.ubox>*:not(.usc){position:relative}
.unit{margin-top:0;border-radius:18px;padding:14px 16px;color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 5px 0 var(--sh)}
.unit h2{font-size:1.25rem;line-height:1.15}.unit p{margin:2px 0 0;font-weight:800;opacity:.92;font-size:.9rem}
.unit small{font-weight:900;opacity:.85;text-transform:uppercase;letter-spacing:.05em;font-size:.72rem}
.unit .ub{margin-left:auto;flex:none;border:2px solid #ffffff80;border-bottom-width:4px;border-radius:14px;padding:8px 10px;font-weight:900;color:#fff;background:#ffffff26;font-size:.85rem}
.unit.lock{background:#e5e5e5!important;color:#afafaf;box-shadow:0 5px 0 #cfcfcf}
.unit.lock .tag{margin-left:auto;background:#fff;color:#999;border-radius:999px;padding:4px 10px;font-weight:900;font-size:.75rem}
.path{position:relative;display:flex;flex-direction:column;align-items:center;padding:3rem 0 .4rem;gap:1.4rem}
.nodeW{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:5.2rem;height:4.8rem;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffffff8c 0,#fff0 38%),var(--c);border:4px solid #fff;box-shadow:0 7px 0 var(--sh),0 10px 18px #0002;font-size:2.2rem;display:grid;place-items:center;position:relative;transition:transform .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sh)}
.node.done{--c:var(--y);--sh:#e5a000}
.node.lockn{--c:#e5e5e5;--sh:#cfcfcf;filter:grayscale(1);opacity:.8;font-size:1.6rem}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid #e5e5e5}
.nst{font-size:.8rem;margin-top:12px;letter-spacing:-1px}
.nlab{font-weight:900;font-size:.85rem;color:var(--ink);background:#ffffffcc;border-radius:999px;padding:1px 8px;margin-top:2px;text-align:center;max-width:130px;line-height:1.15}
.start{position:absolute;top:-44px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:900;color:var(--c2);text-transform:uppercase;font-size:.85rem;animation:float 1.6s ease-in-out infinite;white-space:nowrap;z-index:2}
.start::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes float{50%{transform:translateY(-6px)}}
.pathBod{position:absolute;width:5.4rem;height:5.4rem;top:-.4rem}
.pathBod .bodka{width:5.4rem;height:5.4rem}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
.foot .b3{padding:13px 8px;font-size:.95rem}
.hills{display:none;background:radial-gradient(120px 60px at 15% 100%,#a5e57a 98%,#0000),radial-gradient(160px 70px at 55% 100%,#89d957 98%,#0000),radial-gradient(130px 55px at 92% 100%,#a5e57a 98%,#0000)}
/* hra */
.gameIn{max-width:80rem;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 1rem 1rem}
.gtop{display:flex;align-items:center;gap:12px;padding:.8rem .4rem .6rem}
.gtop .x,.gtop .combo{background:#ffffffd9;border-radius:12px}
.gpanel{flex:1;display:flex;flex-direction:column;background:#ffffffc9;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:1.8rem;padding:1rem 1rem 1.2rem;box-shadow:0 10px 30px #00000017;gap:.4rem}
.gleft{display:flex;flex-direction:column;flex:1}
.gleft .vis{flex:1;justify-content:center}
@media (min-width:700px){.gleft .vis{zoom:1.2}}
@media (min-width:900px) and (min-aspect-ratio:5/4){.gleft .vis{zoom:1.3}}
@media (min-width:900px) and (min-aspect-ratio:5/4){
 .gpanel{display:grid;grid-template-columns:1.35fr 1fr;gap:1.6rem;padding:1.4rem 1.6rem}
 .gright{display:flex;flex-direction:column;justify-content:center}
 .gright .opts{grid-template-columns:repeat(2,1fr)!important;grid-auto-rows:minmax(6.2rem,1fr);margin:0}
 .gright .opts.three{grid-template-columns:repeat(3,1fr)!important}
 .gright .opt{font-size:2.6rem}.gright .opt.txt{font-size:1.5rem}
 .fin{max-width:34rem}
}
.x{font-size:1.6rem;color:#afafaf;width:36px;height:36px;display:grid;place-items:center;font-weight:900}
.bar{flex:1;height:1.1rem;border-radius:999px;background:#ffffffb3;box-shadow:inset 0 2px 0 #0000000f;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--g);transition:width .5s cubic-bezier(.3,1.4,.5,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:#ffffff59}
.combo{font-weight:900;color:var(--o);font-size:.95rem;min-width:44px;text-align:right}
.qline{display:flex;align-items:flex-end;gap:8px;margin-top:10px}
.qline .bodka{width:4.6rem;height:4.6rem;flex:none}
.qline .bub{font-size:1.12rem;padding:12px 14px}
.qline .bub::before{top:auto;bottom:16px}
.vis{margin:16px 0 4px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:10px}
.expr{font-family:Bodka,Nunito,system-ui,sans-serif;font-size:2.7rem;font-weight:600;line-height:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.box{display:inline-grid;place-items:center;min-width:4rem;height:3.9rem;padding:0 10px;border-radius:16px;border:3px dashed var(--b);color:var(--b);background:#ddf4ff;animation:pulse 1.4s infinite}
.box.fill{border-style:solid;border-color:var(--g);color:var(--gd);background:#d7ffb8;animation:none}
@keyframes pulse{50%{transform:scale(1.06)}}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.opts.three{grid-template-columns:repeat(3,1fr)}.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{min-height:4.7rem;font-family:Bodka,Nunito,system-ui,sans-serif;font-size:2.1rem;font-weight:600;background:linear-gradient(#fff,#f5f8fc);color:var(--tc,#3c3c3c)}
.opt:nth-child(1){--tc:#1899d6}.opt:nth-child(2){--tc:#e5532d}.opt:nth-child(3){--tc:#3f9b1e}.opt:nth-child(4){--tc:#9b4fd6}
.opt:hover{border-color:#cfd8e3}
.opt.txt{font-size:1.25rem}
.opt.ok{background:#d7ffb8;border-color:var(--g);color:var(--gd)}
.opt.bad{background:#ffdfe0;border-color:var(--r);color:var(--r);animation:shake .4s;opacity:.65}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.term{border-bottom:3px dotted var(--b);color:var(--bd);cursor:pointer}
/* spodný panel spätnej väzby */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .28s cubic-bezier(.3,1.2,.5,1);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet{visibility:hidden}.sheet.on{transform:none;visibility:visible}
.sheet .in{max-width:640px;margin:0 auto}
.sheet .hd{display:flex;align-items:center;gap:10px}
.sheet .bodka{width:58px;height:58px;flex:none}
.sheet h3{font-size:1.45rem}
.sheet p{margin:4px 0 12px;font-weight:800;line-height:1.35}
.sheet.ok{background:#d7ffb8;color:var(--gd)}
.sheet.try{background:#fff4d6;color:#cd7900}
.sheet.no{background:#ffdfe0;color:#ea2b2b}
.sheet.try .bp{background:var(--o);border-color:#cd7900}
.sheet.no .bp{background:var(--r);border-color:#ea2b2b}
/* vizualizácie */
.frames{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,2rem);grid-auto-rows:2rem;gap:4px;padding:6px;background:#fff7e0;border:3px solid #ffc800;border-radius:14px}
.frame i{border-radius:50%;background:#fff;border:2px solid #f3dfa0;position:relative}
.frame i.r{background:var(--r);border-color:#d33}.frame i.b{background:var(--b);border-color:var(--bd)}
.frame i.h{border:3px dashed var(--b);background:#ddf4ff}
.frame i.x::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.1rem}
.frame i.x{opacity:.5}
.objs{display:flex;flex-direction:column;gap:6px;align-items:center}
.orow{display:flex;gap:4px;font-size:min(2rem,calc((100vw - 6rem)/14));line-height:1}.orow .gap{width:10px}
.pv{display:flex;gap:10px;width:100%;align-items:flex-end;flex-wrap:wrap;justify-content:center;max-width:100%}
.hund{width:4.1rem;height:4.1rem;background:#ffc800;background-image:linear-gradient(#0000 calc(100% - 1px),#b88a00 0),linear-gradient(90deg,#0000 calc(100% - 1px),#b88a00 0);background-size:.41rem .41rem;border:2px solid #b88a00;border-radius:3px}
.ten{width:.56rem;height:4.1rem;background:var(--b);background-image:linear-gradient(#0000 calc(100% - 1px),#0f6fa3 0);background-size:100% .41rem;border:1.5px solid #0f6fa3;border-radius:2px}
.one{width:.56rem;height:.56rem;background:var(--g);border:1.5px solid var(--gd);border-radius:2px}
.grp{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;justify-content:center;max-width:100%}.ones{display:grid;grid-template-columns:repeat(3,.56rem);gap:3px}
.sub{font-weight:800;color:var(--mut);text-align:center;font-size:.92rem}
.brook{position:relative;width:100%;display:flex;align-items:center;gap:4px;padding:2rem 4px .9rem 2.8rem;border-radius:18px;background:linear-gradient(#0000 38%,#bfe9ff 38%,#7fd0f7 100%)}
.brook .home{font-size:2rem;flex:none}
.stones{flex:1;display:flex;gap:4px;justify-content:center;min-width:0}
.stone{flex:1 1 0;min-width:0;height:3.2rem;border-radius:50% 50% 44% 44%/60% 60% 40% 40%;background:#b8c2cc;border:3px solid #8a96a3;border-bottom-width:6px;display:grid;place-items:center;font-family:Bodka,Nunito,system-ui,sans-serif;font-weight:600;font-size:clamp(.9rem,4.4vw,1.6rem);color:#2f3a45;white-space:nowrap}
.brook.big .stone{font-size:clamp(.68rem,3vw,1.3rem);letter-spacing:-.02em}
.stone.q{background:#ddf4ff;border:3px dashed var(--b);color:var(--b);animation:pulse 1.4s infinite}
.stone.q.fill{background:#d7ffb8;border:3px solid var(--g);color:var(--gd);animation:none}
.hog{position:absolute;left:4px;bottom:1rem;font-size:2.1rem;transition:left 1.7s linear}
.hog.go{left:calc(100% - 46px);animation:hop .34s ease-in-out 5}
@keyframes hop{50%{transform:translateY(-14px)}}
.cmp{display:flex;align-items:center;gap:12px;justify-content:center}
.ncard{min-width:5.8rem;padding:10px 12px;border-radius:18px;background:#fff;border:2px solid var(--line);border-bottom-width:5px;text-align:center}
.ncard b{font-family:Bodka,Nunito,system-ui,sans-serif;font-weight:600;font-size:2.4rem;line-height:1;display:block}
.ncard .dots{font-size:.85rem;letter-spacing:1px;color:var(--r);max-width:110px;margin-top:4px}
.slot{width:3.9rem;height:3.9rem;border-radius:50%;border:3px dashed var(--b);display:grid;place-items:center;font-family:Bodka,Nunito,system-ui,sans-serif;font-size:2rem;font-weight:600;color:var(--b);background:#ddf4ff}
.slot.fill{border:3px solid var(--g);color:var(--gd);background:#d7ffb8}
.croc{font-size:.92rem;color:var(--mut);font-weight:800;text-align:center}
.house{display:flex;flex-direction:column;align-items:center}
.roof{width:14.4rem;height:5.3rem;background:var(--r);clip-path:polygon(50% 0,100% 100%,0 100%);display:grid;place-items:end center;padding-bottom:8px;color:#fff;font-family:Bodka,Nunito,system-ui,sans-serif;font-size:2rem;font-weight:600}
.floors{width:12.5rem;background:#fff7e0;border:3px solid #ffc800;border-top:0;border-radius:0 0 12px 12px}
.floor{display:flex;border-top:3px solid #ffc800}
.floor span{flex:1;height:3.25rem;display:grid;place-items:center;font-family:Bodka,Nunito,system-ui,sans-serif;font-size:1.6rem;font-weight:600}
.floor span+span{border-left:3px solid #ffc800}
.floor span.q{color:var(--b);background:#ddf4ff}.floor span.q.fill{color:var(--gd);background:#d7ffb8}
.stmt{font-family:Bodka,Nunito,system-ui,sans-serif;font-size:2.4rem;font-weight:600;padding:12px 20px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;text-align:center}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.plate{display:grid;grid-template-columns:repeat(var(--c,3),auto);place-content:center;gap:0 2px;font-size:var(--f,1.1rem);line-height:1.15;padding:.75rem;border-radius:46%;background:#fff;border:3px solid var(--line);min-width:4rem;min-height:4rem;transition:transform .3s,box-shadow .3s}
.plate.hl{transform:scale(1.1);box-shadow:0 0 0 4px var(--y)}
.basket{border-radius:1rem;background:#fff7e0;border-color:#ffc800}
.arr{display:grid;gap:5px}.arr i{width:1rem;height:1rem;border-radius:50%;background:var(--r)}
.nl{width:100%;max-width:40rem}
.kids{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.kid{display:flex;flex-direction:column;align-items:center;gap:2px}.kid .face{font-size:2rem}
.kid .plate{border-radius:1.1rem}
.pile{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:1.6rem;max-width:min(30rem,100%);min-height:2rem}
/* koniec kola */
.fin{text-align:center;margin:1.5rem auto;max-width:30rem;background:#ffffffeb;border-radius:2rem;padding:1.5rem 1.2rem;box-shadow:0 10px 30px #0002}
.fin .bodka{width:9rem;height:9rem;animation:jump .7s ease-in-out infinite alternate}
@keyframes jump{to{transform:translateY(-14px) rotate(4deg)}}
.fin h2{font-size:2rem;color:var(--y);text-shadow:0 2px 0 #e5a000;margin-top:8px}
.fstars{font-size:3.2rem;margin:8px 0;letter-spacing:6px}
.fstars span{display:inline-block;animation:pop .5s backwards}
.fstars span:nth-child(2){animation-delay:.25s}.fstars span:nth-child(3){animation-delay:.5s}
@keyframes pop{from{transform:scale(0) rotate(-120deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 22px}
.stat{border:2px solid var(--c);border-radius:16px;overflow:hidden}
.stat b{display:block;background:var(--c);color:#fff;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:4px;font-weight:900}
.stat span{display:block;padding:10px 4px;font-family:Bodka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.4rem;color:var(--c)}
.btnrow{display:grid;gap:12px}
/* modál */
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex;animation:fade .25s}
.modal{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.modal h2{font-size:1.5rem;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:2px solid #f1f1f1;font-weight:800}
.row select,.row input[type=range]{max-width:52%}
select{font:inherit;padding:8px;border-radius:12px;border:2px solid var(--line);background:#fff}
.sw{width:56px;height:32px;border-radius:999px;background:#e5e5e5;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px #0003}
.sw.on{background:var(--g)}.sw.on::after{left:28px}
.note{background:#fff4d6;border-radius:14px;padding:10px 12px;font-weight:700;font-size:.9rem;color:#8a5a00;margin-top:10px}
.note.ok{background:#d7ffb8;color:var(--gd)}
.gl{border-bottom:2px solid #f1f1f1;padding:10px 0}
.gl h3{font-size:1.15rem;display:flex;justify-content:space-between;align-items:center}
.gl p{margin:3px 0;font-weight:700}.gl .ex{color:var(--bd)}
.mini{width:40px;height:40px;border-radius:12px;font-size:1.05rem;flex:none}
.tp h3{font-size:1.1rem;margin-top:14px}.tp li{font-weight:700;margin:3px 0}
/* úvod */
.intro{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;padding:20px;background:#ffffff8c;backdrop-filter:blur(3px)}
.intro .stage{background:#ffffffd9;border-radius:2rem;padding:1rem}
.intro.on{display:flex}
.intro .stage{width:100%;max-width:40rem;min-height:210px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-size:2.6rem}
.intro .qline{max-width:40rem;width:100%}
.intro .ctl{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:22px;width:100%;max-width:40rem}
.intro h2{font-size:1.7rem;margin-bottom:6px;text-align:center}
.popin{animation:popin .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes popin{from{transform:scale(0);opacity:0}}
.eq{font-family:Bodka,Nunito,system-ui,sans-serif;font-weight:600;font-size:2.3rem;width:100%;text-align:center}
.fade{opacity:.15;transition:opacity .6s}
.confetti{position:fixed;pointer-events:none;z-index:80;font-size:1.4rem;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),70vh) rotate(540deg);opacity:0}}
.tip{position:fixed;z-index:70;left:50%;bottom:20px;transform:translateX(-50%);width:min(92vw,520px);background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px 16px;display:none}
.tip.on{display:block;animation:fade .25s}
.tip h3{font-size:1.25rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tip p{margin:4px 0;font-weight:700}
.bodka.happy{animation:jump .35s ease-in-out 2 alternate}
.bodka.sad{animation:sad .5s}
@keyframes sad{30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
.bob{animation:bob 3s ease-in-out infinite}
.kroko{width:100%;height:auto;overflow:visible;display:block}
.kroko .kup,.kroko .klo{transform-origin:46px 78px;transition:transform .22s cubic-bezier(.5,1.6,.5,1)}
.kroko .kface{transform-origin:110px 78px;transition:transform .45s}
.kroko .kbody{transition:opacity .6s}.kroko.ghost .kbody{opacity:.22}
.kroko .ksign path{fill:none;stroke:#3c3c3c;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;transition:stroke-dashoffset .9s ease}
.kroko .ksign.on path{stroke-dashoffset:0}

function getBuf(txt){const k=S.proV+'|'+S.rate+'|'+txt;if(bufs.has(k))return bufs.get(k);
 const p=fetch(`${TTS_URL}?v=${S.proV}&r=${S.rate}&t=${encodeURIComponent(txt)}`).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()})
  .then(b=>new Promise((res,rej)=>ac().decodeAudioData(b,res,rej)));bufs.set(k,p);p.catch(()=>bufs.delete(k));return p}
const usePro=()=>TTS_URL&&S.pro&&proState!=='fail'&&ac();
function say(t,onend){
 stopAll();const txt=sp(t);const tok=sayTok;if(!txt){onend&&onend();return}
 let done=false;const fin=()=>{if(!done&&tok===sayTok){done=true;onend&&onend()}};
 if(usePro()){getBuf(txt).then(buf=>{if(tok!==sayTok)return;proState='ok';const s=ac().createBufferSource();s.buffer=buf;s.connect(ac().destination);s.onended=()=>{if(curSrc===s)curSrc=null;fin()};curSrc=s;s.start()})
   .catch(()=>{proState='fail';if(tok===sayTok)sayDevice(txt,fin)});return}
 sayDevice(txt,fin);
}
function sayDevice(txt,fin){
 if(!('speechSynthesis' in window)){setTimeout(fin,Math.max(1800,txt.length*65));return}
 const u=new SpeechSynthesisUtterance(txt);u.lang='sk-SK';const v=bestVoice();if(v){u.voice=v;u.lang=v.lang}
 u.rate=S.rate*.95;u.onend=fin;u.onerror=fin;setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){fin()}},60);
 setTimeout(fin,Math.max(2500,txt.length*95/S.rate));
}
const autoSay=t=>{if(S.auto)say(t)};

function chain(a,b,op){ // pomôcka: rozklad druhého čísla podľa rádov
 const parts=[];const H=Math.floor(b/100)*100,T=Math.floor(b%100/10)*10,O=b%10;
 if(op==='+'&&b<10&&a%10+b>10&&a>=10){const k=10-a%10;return `${a} + ${k} = ${a+k}, potom ${a+k} + ${b-k} = ${a+b}`}
 if(op==='−'&&b<10&&a%10<b&&a>=10){const k=a%10;return `${a} − ${k} = ${a-k}, potom ${a-k} − ${b-k} = ${a-b}`}
 if(op==='+'&&a<10&&a+b>10){const k=10-a;return `${a} + ${k} = 10, potom 10 + ${b-k} = ${a+b}`}
 if(op==='−'&&a>10&&a<20&&a-b<10){const k=a-10;return `${a} − ${k} = 10, potom 10 − ${b-k} = ${a-b}`}
 [H,T,O].forEach(p=>p&&parts.push(p));if(parts.length<2)return '';
 let cur=a,s=[];for(const p of parts){const n=op==='+'?cur+p:cur-p;s.push(`${cur} ${op} ${p} = ${n}`);cur=n}return s.join(', potom ');
}

const OFF=[0,1,1.4,1,0,-1,-1.4,-1].map(v=>v*Math.min(90,innerWidth*.16));
function renderHome(){
 $('#totStars').textContent='⭐'+Object.values(S.stars).reduce((a,b)=>a+b,0);
 $('#grades').innerHTML=GRADES.map(([g,n,r])=>`<button class="${S.grade===g?'on':''}" data-g="${g}">${g}.<span class="rw"> ročník</span><small>${r}</small></button>`).join('');
 $('#heroTxt').textContent=Object.keys(S.stars).length?pick(HELLO.slice(1)):HELLO[0];
 let cur=null;WORLDS.forEach(w=>w.games&&w.games.forEach(g=>{if(!cur&&gStars(g)<3)cur=g}));
 let h='',ni=0;
 WORLDS.forEach((w,wi)=>{
  if(w.lock){h+=`<div class="ubox"><div class="unit lock"><div><small>${wi+1}. časť</small><h2>${w.emoji} ${w.name}</h2><p>${w.desc}</p></div><span class="tag">🔒 Čoskoro</span></div><div class="path">`;
   for(let i=0;i<2;i++)h+=`<div class="nodeW" style="transform:translateX(${OFF[ni++%8]}px)"><div class="node lockn">🔒</div></div>`;h+='</div></div>';return}
  const st=w.games.reduce((a,g)=>a+gStars(g),0);
  h+=`<div class="ubox"><div class="usc">${SCENE(w.scene)}</div><div class="unit" style="background:${w.col};--sh:${w.sh}"><div><small>${wi+1}. časť · ⭐ ${st}/${w.games.length*3}</small><h2>${w.emoji} ${w.name}</h2><p>${w.desc}</p></div><button class="ub" data-intro="${w.id}">▶ Úvod</button></div><div class="path">`;
  w.games.forEach(gid=>{const gm=G[gid],s=gStars(gid),off=OFF[ni++%8];
   h+=`<div class="nodeW" style="transform:translateX(${off}px)">${gid===cur?`<div class="start" style="--c2:${w.col}">Štart</div>`:''}<button class="node ${s===3?'done':''} ${gid===cur?'cur':''}" style="--c:${w.col};--sh:${w.sh}" data-w="${w.id}" data-g="${gid}" aria-label="${gm.name}">${s===3?'👑':gm.icon}</button><div class="nst">${starStr(s)}</div><div class="nlab">${gm.name}</div>
   ${gid===cur?`<div class="pathBod" style="${off>0?'right:120px':'left:120px'}">${BODKA.replace('class="bodka"','class="bodka bob"')}</div>`:''}</div>`});
  h+='</div></div>'});
 $('#map').innerHTML=h;
}
$('#grades').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.grade=+b.dataset.g;save();renderHome();SFX.tap();say(`${S.grade}. ročník. Čísla ${GRADES[S.grade-1][2]}.`)};
$('#map').onclick=e=>{const i=e.target.closest('[data-intro]');if(i){playIntro(WORLDS.find(w=>w.id===i.dataset.intro));return}
 const n=e.target.closest('.node');if(!n)return;if(n.classList.contains('lockn')){say('Túto časť pre teba ešte chystám.');return}
 curW=WORLDS.find(w=>w.id===n.dataset.w);SFX.tap();
 if(!S.seen[curW.id]){S.seen[curW.id]=1;save();playIntro(curW,()=>startGame(n.dataset.g))}else startGame(n.dataset.g)};
$('#heroSpk').onclick=()=>say($('#heroTxt').textContent);

/* ===== úvod ===== */
let IN=null;
function playIntro(w,then){setBg(w.scene);IN={w,i:-1,then};$('#inT').textContent=w.emoji+' '+w.name;$('#intro').classList.add('on');introStep()}
function introStep(){if(!IN)return;clrT();IN.i++;const st=IN.w.intro[IN.i];if(!st){closeIntro(true);return}
 const last=IN.i===IN.w.intro.length-1;$('#inNext').textContent=last?'Poďme hrať':'Ďalej';
 $('#inSay').textContent=st.t;st.a($('#inStage'));const my=IN.i,t0=Date.now();
 say(st.t,()=>{if(IN&&IN.i===my&&!last)T(()=>IN&&IN.i===my&&introStep(),Math.max(900,(st.min||0)-(Date.now()-t0)))})}
function closeIntro(go){clrT();const th=IN&&IN.then;IN=null;if(!th)setBg('luka');$('#intro').classList.remove('on');stopAll();if(go&&th)th()}
$('#inNext').onclick=()=>introStep();$('#inSkip').onclick=()=>closeIntro(true);

/* ===== hra ===== */
const PRAISE=['Výborne!','Super!','Bravo!','Paráda!','Presne tak!','Skvelé!','Tak je!','Počítaš ako profík!'];
const TRY=['Ešte raz!','Skoro!','Nevadí, skús znova!'];
function startGame(gid){if(curW)setBg(curW.scene);R={gid,i:0,n:8,mistakes:0,res:[],streak:0,best:0,t0:Date.now()};show('game');
 $('#gLes').style.display=LESSONS[gid]?'':'none';const lk='L'+(LALIAS[gid]||gid)+S.grade;
 if(LESSONS[gid]&&!S.seen[lk]){S.seen[lk]=1;save();$('#gQ').innerHTML='';$('#gVis').innerHTML='';$('#gOpts').innerHTML='';playIntro(lessonObj(gid),()=>{R.t0=Date.now();nextTask()})}else nextTask()}
$('#gLes').onclick=()=>{if(R&&LESSONS[R.gid])playIntro(lessonObj(R.gid),()=>R.task&&autoSay(R.task.say||R.task.q))};
function nextTask(){
 hideSheet();if(R.i>=R.n)return finish();R.i++;R.tries=0;R.done=false;const gm=G[R.gid];const t=R.task=gm.gen(S.grade);
 $('#barI').style.width=((R.i-1)/R.n*100)+'%';
 $('#combo').textContent=R.streak>=3?'🔥'+R.streak:'';
 $('#gQ').innerHTML=t.q;$('#gVis').innerHTML=t.vis;
 const o=$('#gOpts');const th=t.three!==undefined?t.three:gm.three;o.className='opts'+(th?' three':'')+(gm.two&&!th?' two':'');
 o.innerHTML=t.opts.map(v=>`<button class="opt b3 ${t.txt?'txt':''} ${t.pic?'pic':''}" data-v="${v}">${t.label?t.label(v):fmt(v)}</button>`).join('');
 autoSay(t.say||t.q);prefetch(t.explain);
}
const val=(t,x)=>typeof t.ans==='number'?+x.dataset.v:x.dataset.v;
$('#gOpts').onclick=e=>{const b=e.target.closest('.opt');if(!b||R.done||b.disabled)return;const t=R.task;
 if(val(t,b)===t.ans){b.classList.add('ok');R.done=true;if(R.res.length<R.i)R.res.push(R.tries===0);
  R.streak=R.tries===0?R.streak+1:0;R.best=Math.max(R.best,R.streak);fillAns(t);disableAll();SFX.ok();mood($('#gBod'),'happy');confetti(b);
  const p=pick(PRAISE);sheet('ok',p,R.tries?t.explain:(R.streak>=3?`${R.streak} správne za sebou! 🔥`:''),'Pokračovať');
  setTimeout(()=>say(p+(R.tries?' '+t.explain:'')),220);if(t.after)t.after(()=>{})}
 else{b.classList.add('bad');b.disabled=true;R.tries++;R.streak=0;SFX.no();mood($('#gBod'),'sad');
  if(R.tries===1){R.mistakes++;const m=pick(TRY),hh=t.hintFor?t.hintFor(val(t,b)):(t.hint||'');sheet('try',m,hh,'Skúsiť znova');say(m+' '+hh)}
  else{R.done=true;if(R.res.length<R.i)R.res.push(false);const right=[...$('#gOpts').children].find(x=>val(t,x)===t.ans);right&&right.classList.add('ok');
   fillAns(t);disableAll();sheet('no','Pozri sa, ako na to',t.explain,'Rozumiem');say('Pozri sa, ako na to. '+t.explain);if(t.after)t.after(()=>{})}}
};
function disableAll(){$('#gOpts').querySelectorAll('.opt').forEach(x=>x.disabled=true)}
function fillAns(t){const bx=$('#ansBox');if(bx){bx.classList.add('fill');bx.innerHTML=t.label?t.label(t.ans):fmt(t.ans)}}
let shMode='';
function sheet(mode,title,txt,btn){shMode=mode;const s=$('#sheet');s.className='sheet on '+mode;$('#shT').textContent=title;$('#shP').innerHTML=txt||'';$('#shP').style.display=txt?'':'none';$('#shBtn').textContent=btn;
 mood($('#shBod'),mode==='ok'?'happy':'sad');requestAnimationFrame(()=>document.documentElement.style.setProperty('--sheetH',s.offsetHeight+'px'));
 setTimeout(()=>{const o=$('#gOpts').getBoundingClientRect();if(o.bottom>innerHeight-s.offsetHeight)scrollBy({top:o.bottom-(innerHeight-s.offsetHeight)+12,behavior:'smooth'})},120)}
function hideSheet(){$('#sheet').className='sheet';document.documentElement.style.setProperty('--sheetH','0px')}
$('#shBtn').onclick=()=>{if(shMode==='try'){hideSheet();stopAll()}else nextTask()};
$('#gSpk').onclick=()=>R&&R.task&&say(R.task.say||R.task.q);
$('#gBack').onclick=()=>{setBg('luka');renderHome();show('home')};
function finish(){
 $('#barI').style.width='100%';
 const st=R.mistakes===0?3:R.mistakes<=2?2:1;const k=starKey(R.gid);if(st>(S.stars[k]||0)){S.stars[k]=st;save()}
 $('#finS').innerHTML=Array.from({length:3},(_,i)=>`<span style="${i<st?'':'opacity:.2;filter:grayscale(1)'}">⭐</span>`).join('');
 const good=R.res.filter(Boolean).length,sec=Math.round((Date.now()-R.t0)/1000);
 const txt=st===3?'Úžasné! Všetko na prvý pokus!':st===2?'Výborná práca! Ešte kúsok a máš tri hviezdičky.':'Dobre! Skús to ešte raz, pôjde to lepšie.';
 $('#finT').textContent=st===3?'Si hviezda!':'Kolo dokončené!';$('#finP').textContent=txt;
 $('#finStats').innerHTML=`<div class="stat" style="--c:var(--g)"><b>Presnosť</b><span>${Math.round(good/R.n*100)} %</span></div><div class="stat" style="--c:var(--o)"><b>Séria</b><span>🔥 ${R.best}</span></div><div class="stat" style="--c:var(--b)"><b>Čas</b><span>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</span></div>`;
 show('finish');SFX.win();setTimeout(()=>say(`${st===3?'Si hviezda!':'Kolo dokončené!'} Máš ${st} ${pl(st,'hviezdičku','hviezdičky','hviezdičiek')}. ${txt}`),500);
 for(let i=0;i<(st===3?4:1);i++)setTimeout(()=>confetti($('#finS')),i*300);
}
$('#finAgain').onclick=()=>startGame(R.gid);$('#finBack').onclick=()=>{setBg('luka');renderHome();show('home')};
function confetti(el){const r=el.getBoundingClientRect();for(let i=0;i<14;i++){const c=document.createElement('div');c.className='confetti';c.textContent=pick(['⭐','🎉','✨','🐞','🌼']);
 c.style.left=(r.left+r.width/2)+'px';c.style.top=r.top+'px';c.style.setProperty('--dx',(Math.random()*240-120)+'px');c.style.animationDuration=(0.9+Math.random()*.7)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),1700)}}

/* ===== modály ===== */
function modal(html){$('#modal').innerHTML=html;$('#ov').classList.add('on')}
$('#ov').onclick=e=>{if(e.target.id==='ov'||e.target.closest('.close'))$('#ov').classList.remove('on')};
function openSettings(){
 loadVoices();const sk=skVoices(),cur=bestVoice();
 const dv=(sk.length?sk:voices.filter(v=>/^(sk|cs)/i.test(v.lang))).map(v=>`<option ${cur&&cur.name===v.name?'selected':''}>${v.name}</option>`).join('');
 const proInfo=!TTS_URL?'<div class="note">Profesionálny hlas zatiaľ nie je pripojený, používa sa hlas zariadenia.</div>':proState==='fail'?'<div class="note">Profesionálny hlas je teraz nedostupný, používa sa hlas zariadenia.</div>':'<div class="note ok">✓ Bodka hovorí profesionálnym hlasom.</div>';
 modal(`<h2>⚙️ Nastavenia</h2>
 <div class="row">🔊 Čítať úlohy automaticky<button class="sw ${S.auto?'on':''}" data-k="auto" aria-label="Automatické čítanie"></button></div>
 <div class="row">🎵 Zvukové efekty<button class="sw ${S.sfx?'on':''}" data-k="sfx" aria-label="Zvukové efekty"></button></div>
 ${TTS_URL?`<div class="row">🎙️ Profesionálny hlas<button class="sw ${S.pro?'on':''}" data-k="pro" aria-label="Profesionálny hlas"></button></div>
 <div class="row">Hlas Bodky<select id="selP"><option value="f" ${S.proV==='f'?'selected':''}>ženský</option><option value="m" ${S.proV==='m'?'selected':''}>mužský</option></select></div>`:''}
 <div class="row">🗣️ Hlas zariadenia<select id="selV">${dv||'<option>predvolený</option>'}</select></div>
 <div class="row">🐢 Rýchlosť reči 🐇<input type="range" id="rngR" min="0.8" max="1.2" step="0.1" value="${S.rate}"></div>
 <div class="row"><span>Vyskúšať hlas</span><button class="b3" style="padding:8px 14px" id="tstV">▶ Skúška</button></div>
 ${proInfo}
 ${!TTS_URL&&!sk.length?`<div class="note">⚠️ V zariadení chýba slovenský hlas. Najlepšie hlasy má prehliadač <b>Microsoft Edge</b>. Android: Nastavenia → Prevod textu na reč (Google) → slovenčina. iPad/iPhone: Nastavenia → Prístupnosť → Hovorený obsah → Hlasy → Slovenčina.</div>`:''}
 <div class="row"><span>Začať odznova (zmaže hviezdičky)</span><button class="b3" style="padding:8px 14px" id="rst">🗑️ Vymazať</button></div>
 <div class="btnrow" style="margin-top:14px"><button class="b3 bp wide close">Hotovo</button></div>`);
 $('#modal').querySelectorAll('.sw').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S[k]=!S[k];b.classList.toggle('on',S[k]);if(k==='pro')proState='unknown';save()});
 const sp_=$('#selP');if(sp_)sp_.onchange=e=>{S.proV=e.target.value;save();say('Ahoj, ja som lienka Bodka.')};
 $('#selV').onchange=e=>{S.voice=e.target.value;save();sayDevice('Ahoj, ja som lienka Bodka.',()=>{})};
 $('#rngR').onchange=e=>{S.rate=+e.target.value;save()};$('#tstV').onclick=()=>say('Ahoj, ja som lienka Bodka. Sedem plus päť je dvanásť.');
 $('#rst').onclick=e=>{if(e.target.dataset.c){S.stars={};S.seen={};save();renderHome();e.target.textContent='✔ Vymazané'}else{e.target.dataset.c=1;e.target.textContent='Naozaj? Ťukni znova'}};
}
$('#btnSet').onclick=openSettings;
$('#btnGl').onclick=()=>{modal(`<h2>📖 Slovník pojmov</h2><p style="font-weight:700;color:var(--mut);margin-top:0">Ťukni na 🔊 a Bodka ti pojem vysvetlí. Modré podčiarknuté slová v úlohách sa dajú tiež rozkliknúť.</p>`+
 Object.entries(GL).map(([k,[d,ex]])=>`<div class="gl"><h3>${k}<button class="mini b3" data-s="${k}">🔊</button></h3><p>${d}</p><p class="ex">Príklad: ${ex}</p></div>`).join('')+'<div class="btnrow" style="margin-top:14px"><button class="b3 bp wide close">Zavrieť</button></div>');
 $('#modal').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const[d,ex]=GL[b.dataset.s];say(b.dataset.s+'. '+d+' Príklad: '+ex)})};
$('#btnTeach').onclick=()=>modal(`<h2>🍎 Pre učiteľa</h2><div class="tp">
 <p style="font-weight:700">Aplikácia pokrýva výkonový štandard <b>ŠVP 2023, Matematika, 1. cyklus</b> (1.–3. ročník). Úroveň sa nastavuje voľbou ročníka. Pri slabšej triede alebo v špeciálnej škole pokojne zvoľte nižší ročník. Úlohy sa pri každom spustení generujú nanovo (iné čísla, obrázky aj znenie), takže sa nedajú naučiť naspamäť.</p>
 <h3>🌼 Lúka čísel</h3><ul><li>Čítať, zapísať a porovnať prirodzené čísla (do 20 / 100 / 10 000)</li><li>Orientácia v číselnom rade, rozklad na stovky, desiatky a jednotky</li></ul>
 <h3>🌾 Počtársky mlyn</h3><ul><li>Spamäti sčítať a odčítať (do 20 s prechodom cez 10 / do 100 / do 1 000)</li><li>Rozklad čísla, chýbajúci člen (propedeutika premennej)</li><li>Rozhodnúť o pravdivosti tvrdenia</li></ul>
 <h3>🌻 Kvetinová záhrada</h3><ul><li>Násobenie ako opakované sčítanie, skupiny a obdĺžnikové usporiadanie</li><li>Násobky na číselnej osi, delenie ako rozdeľovanie na rovnaké časti</li><li>V 1. ročníku propedeuticky: sčítanie rovnakých čísel, polovica</li></ul>
 <h3>🪙 Bodkina pokladnička</h3><ul><li>Mince a bankovky eura, sčítanie peňazí, zaplatenie presnej sumy</li><li>Zostatok a sporenie: odčítanie a dopočítavanie (finančná gramotnosť)</li></ul>
 <h3>🔷 Tvary a čiary</h3><ul><li>Trojuholník, štvorec, obdĺžnik, kruh (v 3. ročníku aj päťuholník, šesťuholník), aj v neštandardnej polohe</li><li>Rovná, krivá a lomená čiara, strany a vrcholy, meranie dĺžky (štvorčeky, cm)</li></ul>
 <h3>🕰️ Hodinová veža</h3><ul><li>Celé hodiny, pol, štvrť, trištvrte (aj slovné vyjadrenia „pol ôsmej“), v 3. ročníku po 5 minútach</li><li>Dni v týždni, plynutie času</li></ul>
 <h3>🧩 Hlavolamový les</h3><ul><li>Opakujúce sa a číselné vzory, kombinatorika (systematické vypisovanie možností)</li><li>Čítanie stĺpcového grafu, porovnávanie údajov</li></ul>
 <h3>Ako to funguje</h3><ul><li>Každé kolo má 8 úloh. Po prvej chybe príde nápoveda, po druhej ukážkové riešenie.</li><li>⭐⭐⭐ = bez chyby, ⭐⭐ = najviac 2 chyby, ⭐ = dokončené. Hviezdičky sa ukladajú len v danom zariadení.</li><li>Všetko je nahovorené; v ⚙️ sa dá vypnúť automatické čítanie, efekty a zmeniť rýchlosť reči.</li></ul></div>
 <div class="btnrow" style="margin-top:14px"><button class="b3 bp wide close">Zavrieť</button></div>`);

setBg('luka');renderHome();
</script>
</body>
</html>
